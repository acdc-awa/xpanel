# XrayPanel 主控 Compose（压缩包挂载形态）
#
# 运行方式：release 压缩包解压到宿主目录（如 /opt/xray-panel），此 compose 用固定运行时镜像
# 把产物挂载进容器跑。升级/回滚 = 替换宿主目录里的 master + web/dist，然后 restart。
#
# 目录约定（与 Dockerfile.runtime 对应）：
#   .            宿主安装目录整挂  → /app            (rw；面板内更新需写 master/web 与 .update-pending)
#   ./configs    配置文件只读      → /app/configs     (ro；更新流程不触碰)
#   ./data       数据目录          → /app/data        (rw)
#
# 注意：
#   - 整个安装目录需 chown 给 uid 1000（容器内 app 用户）才能被面板内更新写入，见安装脚本；
#   - 三个端口默认绑 127.0.0.1，由用户自备反代访问；改 BIND_ADDR=0.0.0.0 可对全网卡开放（自行收紧防火墙）。

services:
  master:
    image: xpanel-master-runtime:latest
    # 运行时镜像本地构建（固定壳，不随版本变）；compose up 时缺失即自动构建，
    # 无需手动 docker build；context 经 .dockerignore 收敛为仅 entrypoint（几 KB）。
    build:
      context: .
      dockerfile: Dockerfile.runtime
    restart: unless-stopped
    ports:
      # 三端口绑定宿主机；默认仅回环 127.0.0.1，由用户自备的反代（Caddy/Nginx 等）访问。
      # 改 BIND_ADDR=0.0.0.0 可对全网卡开放（反代与面板不在同一台机时用，注意自行收紧防火墙）。
      # 注意：容器内端口（右侧 18080/18082/6000）跟随 configs/config.yaml 的 app.port/ws_port/sub_port，
      # 改 yaml 时请同步本段与下方 healthcheck。
      - "${BIND_ADDR:-127.0.0.1}:${APP_PORT:-18080}:18080"          # 面板：SPA 前端 + 后端 HTTP API + 探针
      - "${BIND_ADDR:-127.0.0.1}:${APP_WS_PORT:-18082}:18082"       # 节点 WebSocket 网关
      - "${BIND_ADDR:-127.0.0.1}:${APP_SUB_PORT:-6000}:6000"        # 订阅独立端口（0=禁用订阅服务；设为 0 时请删除本行）
    # 应用配置唯一入口 = configs/config.yaml（2026-08-30 拍板：退役环境变量覆盖，杜绝双源漂移）。
    # .env 仅提供编排参数（BIND_ADDR 与上面的宿主端口映射）：容器内应用端口以 config.yaml 为准。
    volumes:
      - .:/app:rw               # 宿主安装目录整挂（rw：面板内更新下载/原子替换/回滚标记）
      - ./configs:/app/configs:ro
      - ./data:/app/data
    healthcheck:
      # 存活/就绪探针挂在面板端口（跟随 config.yaml app.port，默认 18080）
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:18080/readyz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
