# mihomo 手动测试配置（实验环境自测 + 你手动测试共用）
# 服务端：本机 WSL xray v26.6.27，借壳 www.apple.com
mixed-port: 7890
allow-lan: false
mode: rule
log-level: info
external-controller: 127.0.0.1:9090

proxies:
  - name: "VLESS-TCP-REALITY-vision"
    type: vless
    server: 127.0.0.1
    port: 8443
    uuid: 34903645-2a21-4d15-b8e4-57784431114d
    network: tcp
    udp: true
    tls: true
    flow: xtls-rprx-vision
    servername: www.apple.com
    client-fingerprint: chrome
    reality-opts:
      public-key: SUjqUBVYjar8Q1-XQnFy4u86-ISFWyH3RKm3BoNPcDQ
      short-id: abcdef0123456789

  - name: "VLESS-XHTTP-REALITY-packet-up"
    type: vless
    server: 127.0.0.1
    port: 8444
    uuid: 34903645-2a21-4d15-b8e4-57784431114d
    network: xhttp
    udp: true
    tls: true
    servername: www.apple.com
    client-fingerprint: chrome
    reality-opts:
      public-key: SUjqUBVYjar8Q1-XQnFy4u86-ISFWyH3RKm3BoNPcDQ
      short-id: abcdef0123456789
    xhttp-opts:
      mode: packet-up
      path: /

proxy-groups:
  - name: "PROXY"
    type: select
    proxies:
      - VLESS-TCP-REALITY-vision
      - VLESS-XHTTP-REALITY-packet-up
      - DIRECT

rules:
  - MATCH,PROXY