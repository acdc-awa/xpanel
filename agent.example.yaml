# 节点 Agent 配置示例（复制为 agent.yaml 并按节点修改）
master:
  # 主控 ws 地址（不含 query；生产用 wss://，由 Caddy 终止 TLS 后转发给主控）
  url: ws://127.0.0.1:18080/api/v1/node/ws
  node_id: node1
  secret: change-me   # 主控「新增服务器」时生成，仅展示一次

xray:
  bin: /home/zhx/XrayProject/tools/xray/xray-bin/xray
  config_path: /tmp/xray-agent/config.json
  log_path: /tmp/xray-agent/xray.log
  pid_file: /tmp/xray-agent/xray.pid

heartbeat_interval: 30s
reconnect_max: 60s