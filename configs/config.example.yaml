# Xray 面板主控配置示例（复制为 config.yaml 并按环境修改）
app:
  name: xray-panel
  env: dev            # dev | prod（prod 关闭 gin debug 日志）
  port: 18080         # 面板端口（SPA 前端 + 后端 HTTP API，含 /healthz /readyz；APP_PORT）
  ws_port: 18082      # 节点 WebSocket 网关端口（APP_WS_PORT）
  sub_port: 6000      # 订阅独立端口（APP_SUB_PORT；0=禁用订阅服务）
  # public_url: https://panel.example.com   # 面板公网地址；设置后节点「一键安装命令」用 wss://，留空则按请求 Host + ws://
  # ws_public_url: wss://ws.example.com/node/ws   # 节点 WS 对外地址（可独立域名/任意路径）；留空=面板域名 + /node/ws

db:
  driver: sqlite      # sqlite | mysql（开发默认 sqlite，生产用 mysql）
  dsn: ./data/panel.db
  # mysql 示例：
  # driver: mysql
  # dsn: "user:pass@tcp(127.0.0.1:3306)/xray_panel?charset=utf8mb4&parseTime=True&loc=Local"

jwt:
  # 密钥不预设默认值：留空=首次启动自动生成 64 位强随机密钥并持久化到 DB（settings.jwt_secret）；
  # 显式指定请用环境变量 JWT_SECRET（生产建议留空自动生成）
  access_ttl: 2h      # 短期 access token 有效期
  refresh_ttl: 168h   # 长期 refresh token 有效期（7 天）

# TOTP 2FA 加密密钥：用户 TOTP secret 入库前用 AES-GCM 加密，密钥 = sha256(本值)（见 internal/master/services/otp.go）
# 留空=回退用 jwt.secret（即自动生成并持久化到 DB 的那份）——推荐，无固定值风险、每套部署互不相同
# 如需独立于 JWT 的密钥：请用 openssl rand -hex 32 生成随机值填入，且不要写死进仓库/模板
totp:
  encrypt_key: ""

admin:
  # 账密不预设默认值（防默认密码攻击）：留空=首次启动自动生成 16 位强随机密码（控制台高亮显示）
  # 显式指定请用环境变量 ADMIN_USERNAME / ADMIN_PASSWORD（compose/.env）


backup:
  enabled: true            # 定时备份开关（BACKUP_ENABLED）
  schedule: "0 3 * * *"    # cron 表达式：每天 03:00（BACKUP_SCHEDULE）
  keep: 14                 # 保留最近 N 份备份（BACKUP_KEEP）
  dir: ./data/backups      # 备份目录（compose 下位于数据卷）（BACKUP_DIR）

# 面板内更新（容器形态：下载+校验+替换后进程自杀退出，restart: unless-stopped 自动拉起新版本）
update:
  enabled: true            # 面板内更新开关（false=仅显示版本，不做更新）
  repo: acdc-awa/xpanel    # GitHub owner/repo（留空=默认 acdc-awa/xpanel）
  # mirror: https://ghproxy.net/https://github.com   # github.com 替代基址/代理前缀（可选）