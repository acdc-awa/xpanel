# Xray 面板主控配置示例（复制为 config.yaml 并按环境修改）
app:
  name: xray-panel
  env: dev            # dev | prod（prod 关闭 gin debug 日志）
  port: 18080         # 注意：若宿主机 Windows 侧有服务占用同端口，WSL 内绑定会失败
  # public_url: https://panel.example.com   # 面板公网地址；设置后节点「一键安装命令」用 wss://，留空则按请求 Host + ws://
  # web_base: /panel                        # 自定义 Web 访问路径前缀（空=根路径）；可被管理端「设置」页覆盖并即时生效

db:
  driver: sqlite      # sqlite | mysql（开发默认 sqlite，生产用 mysql）
  dsn: ./data/panel.db
  # mysql 示例：
  # driver: mysql
  # dsn: "user:pass@tcp(127.0.0.1:3306)/xray_panel?charset=utf8mb4&parseTime=True&loc=Local"

jwt:
  # 生产务必替换为 >=32 字节随机串（可用 `openssl rand -hex 32` 生成）
  secret: change-me-in-production-at-least-32-chars
  access_ttl: 2h      # 短期 access token 有效期
  refresh_ttl: 168h   # 长期 refresh token 有效期（7 天）

admin:
  # 首次启动自动创建初始管理员；生产首次登录后立即修改密码
  username: admin
  password: admin123


backup:
  enabled: true            # 定时备份开关（BACKUP_ENABLED）
  schedule: "0 3 * * *"    # cron 表达式：每天 03:00（BACKUP_SCHEDULE）
  keep: 14                 # 保留最近 N 份备份（BACKUP_KEEP）
  dir: ./data/backups      # 备份目录（compose 下位于数据卷）（BACKUP_DIR）