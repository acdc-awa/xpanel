# Xray 面板主控配置示例（复制为 config.yaml 并按环境修改）
#
# ⚠️ 唯一入口（2026-08-30 拍板）：本文件（部署时复制为 configs/config.yaml）是应用配置的唯一
#    来源，环境变量不再覆盖任何项；deploy 侧 .env 只承载 compose 编排参数（宿主端口映射/BIND_ADDR）。
#    容器形态：compose 将宿主 configs/ 只读挂载进 /app/configs，entrypoint 固定
#    -config /app/configs/config.yaml；镜像 WORKDIR=/app，相对路径（./data/...）在容器内即
#    挂载的宿主 data 目录，与本地开发（cwd=仓库根）行为一致。
app:
  name: xray-panel
  env: dev            # dev | prod（prod 静默：不打印 gin 访问/调试日志）
  port: 18080         # 面板端口（SPA 前端 + 后端 HTTP API，含 /healthz /readyz）
  ws_port: 18082      # 节点 WebSocket 网关端口
  sub_port: 6000      # 订阅独立端口（0=禁用订阅服务）
  # public_url: https://panel.example.com   # 面板公网地址；设置后节点「一键安装命令」用 wss://，留空则按请求 Host + ws://
  # ws_public_url: wss://ws.example.com/node/ws   # 节点 WS 对外地址（可独立域名/任意路径）；留空=面板域名 + /node/ws
  # 可信反向代理（决定是否采信 X-Forwarded-For；登录/订阅限流、审计日志与人机验证的客户端 IP 都取自它）。
  # 只有 TCP 直连对端命中下列 IP/CIDR 时才使用转发头；否则一律用 RemoteAddr——公网客户端自报
  # X-Forwarded-For / CF-Connecting-IP 不再生效。默认仅信任回环（反代与面板同机时开箱可用）。
  # ⚠️ Docker 部署（面板在容器内、反代在宿主机）：面板看到的来源通常是 Docker 网桥网关而不是回环，
  #    必须把网关地址加入列表（docker compose 默认网络约 172.18.0.1，用 `docker network inspect`
  #    确认后写 - 172.18.0.1/32；整段网桥也可写 - 172.18.0.0/16）。否则所有请求会被视为同一 IP，
  #    限流共享、审计只记网关地址。
  # Cloudflare 前置时把 CF 回源网段也列入，并在反代侧把真实客户端覆盖写入 X-Forwarded-For
  # （见 deploy/master/Caddyfile 注释）。空列表（trusted_proxies: []）= 完全不信转发头，只认 TCP 对端。
  trusted_proxies:
    - 127.0.0.1/32
    - ::1/128

db:
  driver: sqlite      # sqlite | mysql（开发默认 sqlite，生产用 mysql）
  dsn: ./data/panel.db
  # mysql 示例：
  # driver: mysql
  # dsn: "user:pass@tcp(127.0.0.1:3306)/xray_panel?charset=utf8mb4&parseTime=True&loc=Local"

jwt:
  # 密钥不预设默认值：留空=首次启动自动生成 64 位强随机密钥并持久化到 DB（settings.jwt_secret）；
  # 显式指定请写入本文件 jwt.secret（生产建议留空自动生成）
  access_ttl: 2h      # 短期 access token 有效期
  refresh_ttl: 168h   # 长期 refresh token 有效期（7 天）

# TOTP 2FA 加密密钥：用户 TOTP secret 入库前用 AES-GCM 加密，密钥 = sha256(本值)（见 internal/master/services/otp.go）
# 留空=回退用 jwt.secret（即自动生成并持久化到 DB 的那份）——推荐，无固定值风险、每套部署互不相同
# 如需独立于 JWT 的密钥：请用 openssl rand -hex 32 生成随机值填入，且不要写死进仓库/模板
totp:
  encrypt_key: ""

admin:
  # 账密不预设默认值（防默认密码攻击）：留空=首次启动自动生成 16 位强随机密码（控制台高亮显示）
  # 显式指定请写入本文件 admin.username / admin.password


backup:
  enabled: true            # 定时备份开关
  schedule: "0 3 * * *"    # cron 表达式：每天 03:00
  keep: 14                 # 保留最近 N 份备份
  dir: ./data/backups      # 备份目录（容器形态下位于挂载的 data 卷）

# 面板内更新（容器形态：下载+校验+替换后进程自杀退出，restart: unless-stopped 自动拉起新版本）
update:
  enabled: true            # 面板内更新开关（false=仅显示版本，不做更新）
  repo: acdc-awa/xpanel    # GitHub owner/repo（留空=默认 acdc-awa/xpanel）
  # mirror: https://ghproxy.net/https://github.com   # github.com 替代基址/代理前缀（可选）